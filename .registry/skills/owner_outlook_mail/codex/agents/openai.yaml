interface:
  display_name: "Soulforge Owner Outlook Mail"
  short_description: "Bound Outlook drafts, same-thread replies, and safe sends."
  default_prompt: "Use $soulforge-owner-outlook-mail to draft and apply an owner-style Outlook email. For one to three additive facts on an exact Sent source, use the deterministic same-thread local route and preserve the source layout. Preserve current-request bindings, keep drafts unsent, and send only after a separate current explicit instruction for the exact validated draft."

policy:
  allow_implicit_invocation: true
