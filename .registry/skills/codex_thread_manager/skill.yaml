skill_id: codex_thread_manager
kind: skill
status: active
title: Codex Thread Manager
summary: Launch the registered `codex_thread_manager_v0` workflow only for durable Codex task lifecycle changes or multi-task orchestration, with bounded worker topology, handoff continuity, and fresh verifier boundaries.
behavior:
  intent: >
    Provide a Codex-facing bridge for `.workflow/codex_thread_manager_v0`.
    The workflow owns goal binding, NIGHT_WORK_HANDOFF refresh, continuation
    surface selection, manager lifecycle and rollover policy, worker packet
    shape, thread id/title recording, worktree worker boundary routing,
    integration validation, workflow-check closeout, and conservative claim
    reporting. Before loading that workflow, classify applicability. Existing-
    task lookup, read, or status; exact-ID resolution for one send; a one-off
    question or message to an existing task; and organization route or
    authority checking without a lifecycle action use direct task tools and
    the applicable route canon instead. Direct task-tool use does not itself
    trigger this skill. Explicit invocation with an actionable lifecycle or
    orchestration goal is treated as a thread-orchestration request: the
    declared/current Codex thread becomes the main team lead, manages
    handoff/compact/reset lifecycle, and may create
    role worker Codex threads when runtime tools and boundaries support that
    action. For confirmed project work, the manager applies the public project
    organization contract, records exactly one primary responsibility owner
    plus optional collaborators and independent reviewers, returns out-of-scope
    work with a reason and suggested owner, and escalates unclear work. TASK
    packets distinguish responsibility owner, executor or agent, independent
    reviewer, and acceptance or approval authority; these logical roles are
    risk-tailored and are not four mandatory people. New deliverables,
    multi-step work, separate Verification, Validation, independent review, and
    acceptance use a new TASK; small refinements continue the existing TASK
    only when objective, owner, scope, baseline, interface, approval scope, and
    acceptance criteria remain unchanged. Human owners retain final assignment,
    final acceptance, completion, and external-side-effect approval. Task
    Engine authority remains defined by its architecture canon and is only
    referenced here. COMMON work follows the company/team common-work
    organization contract: the team operations manager classifies common or
    unclassified work, preserves a common intake request before later internal
    assignment or peer routing, and cross-branch communication is a collaboration,
    review, or reclassification request rather than a hierarchical command.
    Project candidates with unresolved exact identity route to the sibling
    unassigned-project manager for temporary intake custody only; that route
    does not create project responsibility lanes and hands custody to the exact
    project manager after confirmation.
    The approved two-company human projection keeps the Development Team 1
    operations manager distinct from the Development Team 1 company CEO and
    keeps the AX product CEO distinct from the AI platform company CEO. Both
    company CEOs coordinate priorities, integrate results, and escalate
    blockers only. Human, personnel, budget, purchasing, ordering, external
    commitment, sending, baseline, and final-acceptance decisions remain with
    the Owner. Until a separate governance overlay or directory v2 is approved
    and validated, cross-branch CEO routing is explicit-address only and
    HOLD/non-routable.
    Upward result reports from AX, ERP, SYSTEM, and future persistent AI
    platform company responsibility routes preserve
    `report_item_or_result`, exactly one `primary_owner`,
    `executor_or_agent`, `collaborators`, observed-only
    `independent_reviewers`, actual `manager_or_ceo_contribution`,
    `source_result_validation_evidence`, and
    `owner_decision_or_cross_company_interface`. A manager or CEO does not
    self-credit subordinate execution. Requested and observed models stay
    separate, unobserved provider or model values are `UNKNOWN`, and PARTIAL,
    HOLD, failure, and unknown results retain attribution and blockers.
    For Development1 and AI-organization TASK creation, the approved role
    profile is a standing explicit request for that governed TASK. Codex runs
    `.workflow/codex_thread_manager_v0/role_profile_guard.mjs`, requires exact
    requested model and reasoning effort, and passes them as the actual
    `create_thread` model and thinking arguments. Missing or mismatched values,
    unresolved ranges, default or parent inheritance, and unauthorized Ultra
    are `HOLD`. Fork is limited to observed same-role same-profile continuity.
    Profile mismatch state uses only `UNKNOWN`, `MATCH`, or `profile_mismatch`.
    Development Team 1 is outside the AI platform company's direct notice
    scope and receives the same shape through the customer-supplier interface.
    Separately, Development Team 1 COMMON operations and project managers use
    the same canonical shape for internal upward reports through their own
    company campaign. `manager_contribution` is only a Development Team 1
    display label for `manager_or_ceo_contribution`, not another field or
    schema. Internal campaign recipients are limited to the Development Team 1
    operations manager and active, exact project managers, including the
    unassigned-project manager only when active and exact. Each recipient
    requires stable-catalog `EXACT`, live-binding `EXACT`, and
    `execution_ready=true`; otherwise notice is `HOLD`. The AI platform company
    CEO and AX, ERP, and SYSTEM product organizations are excluded as direct
    recipients.
    Non-project SYSTEM, AX, or ERP work preserves its existing owner routing,
    and all non-applicable project-extension packet fields are recorded as
    `not_applicable` rather than inventing a project.
    Worker threads
    are subagent-first lane controllers:
    substantive
    lane work is delegated to fresh bounded subagents by default, and direct
    worker execution is allowed only for explicit no-subagent exceptions such
    as packet authoring, small deterministic checks, integration, validators,
    manager-authorized narrow mechanical edits, unavailable subagent tools, or
    an unsafe minimal packet. Fork, rollover, and continuation are same-role
    continuity surfaces, not independent verification surfaces; verifier,
    judge, review, workflow-check, or acceptance lanes that affect readiness
    use fresh-context threads or fresh bounded subagents from minimal evidence
    packets. This skill maps explicit user language to that workflow without
    turning local thread tools, raw transcripts, private payloads, or default
    route authority into skill canon.
  use_when:
    - the user asks to create, fork, continue, rollover, hand off, or archive a durable Codex task
    - the user wants manager, worker, or worktree task topology orchestration instead of only subagents
    - the user asks to coordinate or integrate multiple durable Codex task lanes
    - the user invokes `$soulforge-codex-thread-manager` with an actionable lifecycle or orchestration goal
  avoid_when:
    - the task is a normal short request that does not need durable thread orchestration
    - the request only lists, finds, reads, or checks the status of an existing Codex task
    - the request only resolves an exact task ID for one send or sends one question or message to an existing task
    - the request only checks organization routing, responsibility, or authority without changing a task lifecycle
    - a task tool is used for a one-off existing-task action; tool use alone is not a skill trigger
    - the user wants the older contamination-free subagent handoff pattern owned by `long_thread_handoff_v0`
    - the request would require raw transcript storage, private payload copying, secret inspection, or external side effects without authorization
    - the request would require `.party` binding, default-route switching, or production-ready claims without a separate owner-approved route
  expected_outcome:
    - Codex applies the skill applicability gate before reading registered workflow files or refreshing `NIGHT_WORK_HANDOFF`
    - Codex returns `not_applicable` to the direct task-tool and route-canon path for one-off existing-task or route-check requests, without worker creation or Board enrollment
    - On `applicable`, Codex reads `.workflow/codex_thread_manager_v0/workflow.yaml`, `step_graph.yaml`, `handoff_rules.yaml`, and `profile_policy.yaml`
    - Codex binds the goal, workspace scope, success criteria, stop conditions, public/private boundary, and claim ceiling before creating or continuing threads
    - Codex refreshes `NIGHT_WORK_HANDOFF` before thread creation, manager rollover, compact, clear, or substantial closeout
    - Codex treats explicit skill invocation with an actionable lifecycle or orchestration goal as authorization for the declared thread to act as main team lead and create role worker threads by default when thread tools and scope boundaries support that action
    - Codex refreshes structured handoff before worker creation, compact, clear, rollover, cross-PC/overnight continuation, and substantial phase closeout
    - Codex reads the public project organization contract before classifying project work
    - Codex reads the public company/team common-work contract before classifying COMMON work
    - Codex reads the approved two-company organization contract before CEO coordination
    - Codex never treats either CEO as a v1 cross-branch parent and keeps automatic CEO routing HOLD/non-routable without a separately approved governance overlay or directory v2
    - Codex preserves the eight-field upward result attribution shape for AX, ERP, SYSTEM, and future persistent AI platform company routes without manager or CEO self-credit
    - Codex uses the same canonical attribution shape for Development Team 1 COMMON and project manager internal upward reports through a separate Development Team 1 company campaign, with `manager_contribution` only as the display label for `manager_or_ceo_contribution`
    - Codex fails closed unless each Development Team 1 internal campaign recipient is an allowed active exact manager with stable-catalog EXACT, live-binding EXACT, and `execution_ready=true`, and excludes the AI platform company CEO and AX, ERP, and SYSTEM product organizations as direct recipients
    - Codex keeps Development Team 1 outside the AI platform company's direct notice scope and preserves the same shape at the customer-supplier interface
    - Codex separates requested and observed models, records unobserved provider or model values as UNKNOWN, and keeps actual performers and blockers for PARTIAL, HOLD, failure, and unknown results
    - Codex resolves Development1 and AI-organization role profiles from the approved organization model policy and requires `role_profile_guard.mjs` PASS before governed task creation
    - Codex packets record exact `requested_model`, `requested_reasoning_effort`, profile source and resolution state, observed profile or `UNKNOWN`, and mismatch state
    - Codex passes exact requested model and reasoning effort as `create_thread` model and thinking arguments and never inherits the configured default, manager, parent, or Ultra
    - Codex allows Ultra only for an explicitly authorized major Gate and uses fork only for observed same-role same-profile continuity
    - Codex preserves explicit Owner decisions for people, personnel, budget, purchasing, ordering, external commitments, sending, baselines, and final acceptance
    - Codex applies project assignment fields only to confirmed project work and preserves existing owner routing with `not_applicable` project-extension fields for non-project work
    - Codex distinguishes owner directives from peer collaboration, review, and reclassification requests without transferring domain authority
    - Codex routes unresolved project candidates to temporary unassigned-project custody and hands them to the exact project manager after confirmation
    - Codex records exactly one primary responsibility owner and separates collaborators, independent reviewers, and acceptance or approval authority
    - Codex returns out-of-scope work with a reason and suggested primary owner, and escalates unclear classification
    - Codex distinguishes responsibility owner, executor or agent, independent reviewer, and acceptance or approval authority without assuming four mandatory people
    - Codex creates a new TASK for a new deliverable, multi-step work, separate Verification, Validation, independent review, or acceptance and continues an existing TASK only when objective, owner, scope, baseline, interface, approval scope, and acceptance criteria match
    - Codex applies start, change, and complete gates and preserves human owner approval for final assignment, final acceptance, completion, and external side effects
    - Codex references Task Engine authority canon without redefining or activating it
    - Codex routes non-durable side work to subagents and durable lanes to Codex worker threads
    - Codex uses fresh-context verifier/judge/reviewer lanes for independent acceptance and does not fork or continue the implementer for that judgment
    - Codex requires worker threads to be subagent-first for substantive lane work and to record any no-subagent exception
    - Codex allows worker threads to create bounded subagents inside their assigned lane by default, with the count determined by lane scope unless the packet sets a specific limit
    - Codex worker and verifier packets include objective, lane role, current state, acceptance criteria, allowed read/write scope, side-effect limits, validator expectations, result packet shape, execution-contract claim ceiling, stop conditions, and conflict protocol
    - Codex can pass bounded result packets between worker threads or route all results through the manager
    - Codex records thread titles/ids when available, integrates worker summaries after checking actual state, and closes with validators plus workflow-check posture
execution_requirements:
  required_capabilities:
    - workflow_contract_reading
    - goal_scope_binding
    - context_lifecycle_management
    - durable_checkpoint_curation
    - delegation_surface_routing
    - verifier_judge_independence_routing
    - codex_thread_creation_or_continuation
    - worker_thread_packet_authoring
    - worker_subagent_delegation_policy
    - worker_no_subagent_exception_policy
    - inter_thread_result_routing
    - manager_rollover_acceptance
    - actual_file_state_integration
    - deterministic_validation_routing
    - project_work_responsibility_classification
    - common_team_work_responsibility_classification
    - cross_branch_request_relationship_classification
    - task_thread_create_or_continue_routing
    - task_logical_role_and_gate_packet_authoring
    - governed_role_profile_resolution_and_preflight
    - upward_result_attribution_reporting
  preferred_capabilities:
    - worktree_worker_thread_isolation
    - bounded_subagent_fanout
    - workflow_check_bridge
    - post_development_review_gate
  preferred_tools:
    - create_thread
    - send_message_to_thread
    - handoff_thread
    - set_thread_title
    - rg
    - git_status
    - yaml_validator
  notes:
    - "The workflow remains `.workflow/codex_thread_manager_v0/`; read it at execution time."
    - "The installed Codex mirror name after sync is normally `soulforge-codex-thread-manager`."
    - "The normal launcher behavior is the declared/current thread as main team lead plus subagent-first role worker Codex threads for substantial actionable invocations; worker/subagent counts are scope-driven unless a manager packet sets a limit."
    - "Worker threads should not skip fresh bounded subagents for substantive lane work unless a named no-subagent exception applies and is reported."
    - "Fork, rollover, and continuation are not independence evidence; verifier, judge, review, workflow-check, and acceptance lanes use fresh context unless the claim is explicitly lowered."
    - "This skill does not create party binding, default-route safety, source truth, owner approval, or production-ready claims."
notes:
  - "`codex_thread_manager` is a thin Codex bridge for `.workflow/codex_thread_manager_v0`."
  - "Runtime thread ids, raw transcripts, account state, private payloads, secrets, and absolute local paths stay outside the tracked skill package."
