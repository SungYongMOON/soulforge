<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>내 응답 대기함 · Soulforge</title><link rel="stylesheet" href="/owner-attention/style.css"></head>
<body>
  <header><a class="brand" data-world-home href="/">Soulforge</a><span>오너 작업 공간</span><a data-world-home href="/">자료·검토로 돌아가기</a></header>
  <main>
    <div class="heading"><div><p class="eyebrow">내 응답으로 다음 일이 시작됩니다</p><h1>응답 대기함</h1><p class="intro">봇이 명시적으로 요청한 질문만 모았습니다. 답변은 연결된 Buzz 대화에서 이어가세요.</p></div><button id="refresh" type="button">새로 고침</button></div>
    <p id="connection" class="connection" role="status" aria-live="polite">현재 요청을 확인하고 있습니다.</p>
    <div class="stats" aria-label="응답 대기 현황"><div><span>지금 응답할 일</span><strong id="active-count">—</strong></div><div><span>기한 지남</span><strong id="overdue-count">—</strong></div><div><span>미뤄 둔 일</span><strong id="snoozed-count">—</strong></div></div>
    <div class="toolbar"><div role="group" aria-label="목록 보기"><button type="button" data-filter="active" aria-pressed="true">응답 필요</button><button type="button" data-filter="snoozed" aria-pressed="false">미뤄 둠</button><button type="button" data-filter="closed" aria-pressed="false">응답·철회 기록</button></div><span id="notification" class="muted">알림 연결 확인 전</span></div>
    <section id="requests" aria-label="오너 응답 요청" aria-busy="true"></section>
    <p class="footnote">‘확인했어요’는 읽음 표시입니다. 업무 수락이나 완료를 바꾸지 않습니다. 요청이 철회되거나 실제 오너 답변이 확인될 때 기록으로 이동합니다.</p>
  </main><script type="module" src="/owner-attention/page.mjs"></script>
</body></html>
