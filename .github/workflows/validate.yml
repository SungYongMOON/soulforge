name: Validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  root-done-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Python
        id: python_runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Install root dependencies
        run: npm ci

      - name: Install ui-workspace dependencies
        run: npm ci --prefix ui-workspace

      - name: Install contract-test dependencies
        run: python -m pip install -r ui-workspace/apps/dev-erp/test/fixtures/e14_contract_v1/requirements.txt

      - name: Verify signed work-intake packets
        env:
          WORK_INTAKE_TEST_KIT_ROOT: ${{ github.workspace }}/ui-workspace/apps/dev-erp/test/fixtures/e14_contract_v1
        run: python -I -B -m unittest discover -s ui-workspace/apps/dev-erp/test -p test_work_intake_packet_reader.py -v

      - name: Verify isolated packet-reader interpreter
        env:
          WORK_INTAKE_TEST_PYTHON: ${{ steps.python_runtime.outputs.python-path }}
        run: |
          node --input-type=module <<'JS'
          import { realpathSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { intakeOrdinary } from './ui-workspace/apps/dev-erp/src/work_intake_io.mjs';
          const selected = process.env.WORK_INTAKE_TEST_PYTHON;
          const executable = realpathSync(selected);
          await intakeOrdinary(executable);
          console.log(`Interpreter alias resolved: ${selected !== executable}`);
          execFileSync(executable, ['-I', '-B', '-c', 'import pydantic, cryptography; print("Isolated packet-reader interpreter ready")'], { env: {}, stdio: 'inherit', timeout: 15000 });
          JS

      - name: Run root done check
        env:
          SOULFORGE_SECURE_WORK_TEST_PYTHON: ${{ steps.python_runtime.outputs.python-path }}
          WORK_INTAKE_TEST_PYTHON: ${{ steps.python_runtime.outputs.python-path }}
          WORK_INTAKE_TEST_KIT_ROOT: ${{ github.workspace }}/ui-workspace/apps/dev-erp/test/fixtures/e14_contract_v1
        run: npm run done:check
