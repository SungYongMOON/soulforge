workflow_id: codex_thread_manager_v0
kind: step_graph
status: active
steps:
  - step_id: intake_and_goal_bind
    title: Intake And Goal Bind
    actor_slot: thread_manager
    action:
      kind: codex_thread_goal_scope_binding
    inputs:
      - soulforge_task_goal
      - active_workspace_scope
      - boundary_policy_ref
      - thread_orchestration_request
    optional_inputs:
      - active_goal_ref
      - owner_decision_refs
      - common_team_operations_organization_ref
      - project_work_organization_ref
      - project_work_assignment_request
      - existing_task_thread_refs
      - task_engine_authority_ref
      - stable_route_catalog_ref
      - local_live_bindings_ref
      - route_capability_requirements
    outputs:
      - declared_thread_goal
      - success_criteria
      - stop_conditions
      - boundary_constraints
      - manager_activation_decision
      - context_lifecycle_plan
      - request_origin_relationship
      - request_relationship
      - project_work_assignment_decision
      - scope_acceptance_state
      - primary_owner
      - executor_or_agent
      - collaborators
      - independent_reviewers
      - acceptance_or_approval_authority
      - reclassification_request
      - escalation_state
      - task_thread_routing_decision
      - task_logical_role_plan
      - task_gate_state
    rules:
      organization_contract_is_read_before_project_assignment: true
      common_team_operations_contract_is_read_before_common_assignment: true
      two_company_organization_contract_is_read_before_ceo_coordination: true
      task_engine_authority_is_referenced_not_redefined: true
      project_assignment_extension_applies_only_to_confirmed_project_work: true
      non_project_work_preserves_existing_owner_routing: true
      non_project_project_extension_outputs_are_not_applicable: true
      common_or_unclassified_work_is_classified_by_common_team_manager: true
      common_intake_request_is_distinct_from_internal_assignment: true
      unclear_common_classification_escalates_to_human_owner: true
      development1_operations_manager_is_not_company_ceo: true
      ceo_reserved_human_authority_requires_explicit_owner_decision: true
      cross_branch_ceo_auto_route_is_hold_without_governance_overlay: true
      project_candidate_with_unresolved_identity_routes_to_unassigned_project_manager: true
      unassigned_project_manager_does_not_own_common_or_development_work: true
      confirmed_project_identity_routes_to_exact_project_manager: true
      cross_branch_request_is_collaboration_review_or_reclassification_not_command: true
      cross_branch_request_does_not_transfer_domain_authority: true
      human_owner_directive_preserves_owner_authority_ref: true
      project_ceo_or_manager_performs_initial_classification: true
      exactly_one_primary_owner_required: true
      collaborators_and_reviewers_are_zero_or_more_and_never_co_primary: true
      functional_owner_accepts_only_in_scope_work: true
      out_of_scope_owner_does_not_execute_received_work: true
      reclassification_request_includes_reason_and_primary_owner_candidate: true
      unclear_or_conflicting_route_escalates_to_project_ceo_or_manager: true
      new_deliverable_multistep_work_separate_verification_validation_independent_review_or_acceptance_requires_new_task: true
      small_refinement_continues_existing_task_only_when_objective_primary_owner_scope_baseline_interface_approval_scope_and_acceptance_match: true
      task_packet_separates_responsibility_owner_executor_independent_reviewer_and_acceptance_authority: true
      logical_roles_do_not_require_four_distinct_people: true
      task_start_gate_must_pass_before_execution_or_thread_creation: true
      scope_acceptance_does_not_replace_human_owner_final_approval: true
      classification_or_task_decision_never_authorizes_external_side_effects: true
    next:
      - checkpoint_refresh
  - step_id: checkpoint_refresh
    title: Checkpoint Refresh
    actor_slot: checkpoint_curator
    action:
      kind: night_work_handoff_update
    inputs:
      - declared_thread_goal
      - boundary_constraints
      - request_origin_relationship
      - request_relationship
      - project_work_assignment_decision
      - task_thread_routing_decision
      - task_logical_role_plan
      - task_gate_state
    optional_inputs:
      - prior_night_work_handoff_ref
      - active_worker_thread_refs
      - target_file_refs
      - validation_command_refs
    outputs:
      - night_work_handoff
      - compact_clear_or_rollover_checkpoint
      - project_work_assignment_checkpoint
    rules:
      project_extension_inputs_accept_not_applicable_for_non_project_work: true
      required_before_thread_creation: true
      required_before_manager_rollover: true
      required_before_compact_or_clear: true
      raw_transcript_forbidden: true
      private_payload_forbidden: true
      secrets_forbidden: true
    next:
      - continuation_surface_decision
  - step_id: continuation_surface_decision
    title: Continuation Surface Decision
    actor_slot: surface_router
    action:
      kind: same_thread_manager_worker_worktree_or_subagent_selection
    inputs:
      - night_work_handoff
      - boundary_constraints
      - project_work_assignment_decision
      - task_thread_routing_decision
      - task_gate_state
    optional_inputs:
      - manager_thread_ref
      - active_worker_thread_refs
      - context_pressure_signal
      - target_file_refs
    outputs:
      - thread_team_topology
      - continuation_surface_decision
      - delegation_routing_decision
      - manager_lifecycle_action
      - registered_manager_route_resolution
      - worker_lane_plan
      - task_thread_routing_decision
    rules:
      project_extension_inputs_accept_not_applicable_for_non_project_work: true
      assignment_decision_precedes_thread_routing: true
      start_gate_precedes_worker_thread_creation: true
      new_task_and_existing_task_continuation_must_not_both_be_selected: true
      subagent_for_non_durable_side_work: true
      worker_thread_for_durable_lane: true
      explicit_skill_invocation_defaults_to_manager_thread_plus_role_workers: true
      fresh_manager_not_default_for_launcher_invocation: true
      same_thread_only_for_trivial_preflight_unclear_goal_or_blocked_tools: true
      worker_phase_change_does_not_clear_manager: true
      manager_rollover_before_24h_or_cross_pc: true
      manager_routes_result_packets_between_workers_when_useful: true
      worktree_required_for_overlapping_file_mutation: true
      fork_rollover_and_continuation_are_same_role_continuity_not_independence: true
      fresh_verifier_or_judge_for_acceptance_and_readiness_claims: true
      subagent_not_durable_lane: true
      stable_route_resolution_is_read_only: true
      exact_unique_registered_manager_route_identity_required_for_binding_maintenance: true
      create_or_rollover_binding_refresh_requires_active_route: true
      retire_binding_maintenance_is_invalidation_only: true
      ambiguous_stale_unknown_retired_or_do_not_route_resolution_never_sends: true
    next:
      - manager_rollover_or_worker_packet
  - step_id: manager_rollover_or_worker_packet
    title: Manager Rollover Or Worker Packet
    actor_slot: worker_packet_author
    action:
      kind: manager_acceptance_or_worker_thread_packet_preparation
    inputs:
      - continuation_surface_decision
      - night_work_handoff
      - worker_lane_plan
    optional_inputs:
      - active_worker_thread_refs
      - target_file_refs
      - validation_command_refs
    outputs:
      - manager_rollover_packet
      - worker_thread_packet_set
    rules:
      project_extension_packet_fields_use_not_applicable_for_non_project_work: true
      worker_packet_includes_request_origin_current_relationship_and_owner_authority_ref_when_applicable: true
      fresh_manager_prompt_self_contained: true
      worker_prompt_names_title_and_scope: true
      worker_prompt_subagent_first_for_substantive_lane_work: true
      worker_subagents_allowed_when_bounded_unless_packet_denies: true
      worker_thread_may_spawn_subagents_inside_assigned_lane: true
      worker_subagent_count_is_scope_driven_unless_manager_sets_limit: true
      worker_subagent_first_bounds_or_denial_must_be_written_in_packet: true
      no_subagent_exception_must_be_named_when_worker_does_substantive_work_directly: true
      delegation_packet_minimum_required: true
      worker_prompt_names_context_refs_current_state_acceptance_criteria_allowed_scope_and_side_effect_limits: true
      worker_result_packet_shape_required: true
      worker_packet_includes_primary_owner_executor_collaborators_independent_reviewers_acceptance_authority_and_task_gate: true
      verifier_packet_must_be_fresh_context_minimal_evidence: true
      verifier_or_judge_must_not_be_fork_or_continuation_of_implementer: true
      implementer_self_check_not_independent_verification: true
      verifier_inspects_actual_files_or_status_when_available: true
      worker_prompt_includes_handoff_context_and_compact_report_shape: true
      recursive_subagent_fanout_requires_bounds_and_reporting: true
      nested_worker_thread_automation_or_canon_creation_requires_manager_permission: true
      worker_id_title_recording_required: true
    next:
      - worker_execution_or_rollover_acceptance
  - step_id: worker_execution_or_rollover_acceptance
    title: Worker Execution Or Manager Lifecycle Acceptance
    actor_slot: manager_rollover_controller
    action:
      kind: manager_lifecycle_observation_and_worker_acceptance_gate
    inputs:
      - manager_rollover_packet
      - worker_thread_packet_set
    optional_inputs:
      - manager_thread_ref
      - active_worker_thread_refs
      - stable_route_catalog_ref
      - local_live_bindings_ref
      - route_capability_requirements
    outputs:
      - thread_creation_log
      - manager_acceptance_report
      - registered_manager_lifecycle_observation
      - local_binding_maintenance_request
      - worker_result_summary_set
      - verifier_independence_note
    rules:
      create_worker_thread_after_actionable_skill_invocation_when_available: true
      old_manager_checks_new_manager_acceptance: true
      new_manager_must_reinvoke_runtime_skill_or_read_bridge: true
      worker_thread_id_title_recorded_by_manager: true
      worker_direct_substantive_execution_requires_recorded_no_subagent_exception: true
      acceptance_verifier_created_fresh_or_claim_lowered: true
      files_not_modified_in_read_only_pilot: true
      registered_manager_create_rollover_or_retire_may_request_local_binding_refresh: true
      binding_refresh_requires_actual_thread_observation: true
      stable_route_identity_is_not_replaced_by_runtime_binding: true
      ephemeral_worker_or_performer_thread_never_becomes_stable_route_or_org_owner: true
      retire_only_invalidates_local_binding_and_never_sends: true
      planned_pilot_or_blocked_bridge_requires_execution_ready_false: true
    next:
      - integration_and_validation
  - step_id: integration_and_validation
    title: Integration And Validation
    actor_slot: integration_controller
    action:
      kind: worker_result_integration_and_state_validation
    inputs:
      - thread_creation_log
      - worker_result_summary_set
      - boundary_constraints
    optional_inputs:
      - registered_manager_lifecycle_observation
      - local_binding_maintenance_request
      - stable_route_catalog_ref
      - local_live_bindings_ref
      - target_file_refs
      - validation_command_refs
    outputs:
      - integration_validation_log
      - local_binding_maintenance_result
      - boundary_review_note
      - claim_ceiling
    rules:
      inspect_actual_status_before_decision: true
      do_not_revert_unowned_changes: true
      validators_before_stronger_claims: true
      independent_review_not_satisfied_by_implementer_fork: true
      partial_pilot_lowers_claim_ceiling: true
      change_gate_required_when_objective_requirement_baseline_interface_owner_or_acceptance_changes: true
      verification_and_validation_purpose_criteria_evidence_and_judgment_remain_distinct: true
      complete_gate_requires_objective_evidence_configuration_state_open_risk_and_acceptance: true
      local_binding_maintenance_is_optional_local_only_and_registered_manager_only: true
      local_binding_maintenance_conveys_no_domain_route_or_default_authority: true
      local_binding_maintenance_has_no_send_dispatch_provider_startup_or_configuration_side_effect: true
      runtime_values_never_materialized_in_tracked_workflow: true
      non_exact_or_non_ready_resolution_produces_no_actionable_binding: true
    next:
      - validation_and_review
  - step_id: validation_and_review
    title: Validation And Review
    actor_slot: validation_controller
    action:
      kind: workflow_check_and_deterministic_validation
    inputs:
      - integration_validation_log
      - boundary_review_note
      - claim_ceiling
    optional_inputs:
      - validation_command_refs
      - owner_decision_refs
    outputs:
      - workflow_check_review_packet
      - strongest_supported_workflow_status
      - default_route_safe
    rules:
      workflow_check_required: true
      workflow_generator_provenance_checked: true
      registration_surface_checked_when_claimed: true
      default_route_safety_named: true
      stronger_claims_require_evidence: true
    next:
      - closeout_or_registration_decision
  - step_id: closeout_or_registration_decision
    title: Closeout Or Registration Decision
    actor_slot: closeout_controller
    action:
      kind: conservative_thread_workflow_closeout
    inputs:
      - workflow_check_review_packet
      - strongest_supported_workflow_status
      - default_route_safe
    optional_inputs:
      - owner_decision_refs
    outputs:
      - closeout_report
      - result_report_attribution
      - next_action
      - knowledge_trigger_check
    rules:
      workflow_check_required_for_status_claim: true
      registration_requires_explicit_owner_request: true
      party_creation_only_for_multi_workflow_chain: true
      default_route_safety_not_claimed_without_owner_intent: true
      unresolved_assignment_or_failed_start_gate_returns_without_thread_creation: true
      superior_result_report_separates_primary_owner_executor_collaborators_reviewer_and_manager_contribution: true
      superior_result_report_requires_exactly_one_primary_owner: true
      superior_result_report_requires_result_executor_collaborators_manager_contribution_evidence_status_and_owner_gate: true
      superior_result_report_includes_independent_reviewer_only_when_present: true
      manager_self_check_or_implementer_fork_is_not_reported_as_independent_review: true
      unconfirmed_attribution_is_not_inferred: true
    next: []
stop_conditions:
  - conflicting_active_goal
  - unsafe_public_private_boundary
  - secret_or_credential_required
  - owner_decision_required_for_registration_or_default_route
  - unavailable_thread_tool
  - worker_write_scope_overlap_without_worktree
  - independent_verifier_unavailable_for_required_claim
  - worker_direct_substantive_execution_without_no_subagent_exception
  - unbounded_recursive_subagent_fanout_requested_or_observed
  - validator_failure_unfixable_in_scope
  - ambiguous_stale_unknown_or_do_not_route_manager_resolution
  - binding_maintenance_requires_send_dispatch_or_provider_configuration
  - exhausted_user_specified_budget
