workflow_id: five_field_session_capture_v0
kind: workflow
status: draft
title: Five-Field Session Capture v0
summary: Codex/Claude 등 어떤 AI 세션이든 bounded AI 작업 결과의 5필드(입력/판단/출력/검증/중단조건)+집계키를 _workmeta 레저에 착지시키고, 공개 Git 누락분은 feature-OFF cursor planner로 결정적으로 식별하는 절차. 차단형 하네스 훅과 자동 복구 실행은 비활성 상태다.
global_name_ko: "오필드캡처"
global_name_ko_scope: draft_invocation_alias_candidate
global_name_ko_note: "Korean invocation-ready alias; no slash, spaces, dash, colon, or path-like symbols."
display_name_ko: "운영/세션종료/5필드기록"
display_name_ko_scope: draft_authoring_aid
naming_contract_ref: .workflow/docs/WORKFLOW_NAMING_CONTRACT_V0.md
classification_lane:
  primary: operations
  primary_name_ko: 운영
  secondary:
    - review_governance
  secondary_name_ko:
    - 검토 거버넌스
  purpose: discovery_only
  authority: none
  notes:
    - Workflow lane is for indexing and discovery only.
execution_binding:
  party_required: false
  candidate_party_id: null
  bound_party_id: null
  binding_authority: none
  notes:
    - 모든 AI 작업 세션(Codex CLI, Claude Code, 기타)이 자기 세션 종료 절차로 직접 실행한다.
    - 기록 작성자는 항상 그 세션의 AI(사람 수기 금지 아님 — 단 기본값은 AI 자동작성. assignee_memory 0행 교훈).
entrypoint: run
execution_mode: local_tool_sequence
profile_policy: profile_policy.yaml
calibrations: calibrations/
history: history/
contract_refs:
  - _workmeta/system/dev_worker_candidate_queue/request_to_automation_ladder_v0.yaml
  - ui-workspace/apps/dev-erp/docs/slices/FIVE-FIELD-CAPTURE.md
inputs:
  - bounded_task_result           # 방금 끝난 작업의 결과(무엇을 만들었나)
  - session_ref                   # 세션 식별자(예: codex_20260704_p26014a)
  - worker_label                  # 도구_모델 표기(예: codex_gpt-5.3, claude_fable-5)
  - project_code                  # 과제 코드 또는 system
optional_inputs:
  - occurred_at                  # source commit 발생시각(strict UTC)
  - recorded_at                  # 최초 레저 기록시각(strict UTC)
outputs:
  - five_field_ledger_record      # _workmeta/<project>/reports/procedure_capture/five_field_log.jsonl 1행
  - capture_receipt               # CLI stdout JSON(id/ledger/needs_backfill/record_digest)
  - cursor_sweep_receipt          # public-safe feature-OFF 계획 receipt; private cursor write 아님
boundary_rules:
  - 원문(메일 본문/첨부/문서 본문) 복사 금지 — input_refs 는 포인터(경로/id)만, CLI 가 크기 가드로 거부.
  - secret/token/credential 값 기록 금지.
  - 레저는 _workmeta(private repo) 전용 — public tree 에 5필드 내용 커밋 금지.
  - ERP 업무 레인은 이 워크플로우가 아니라 dev-erp completion_log 자동 캡처(FIVE-FIELD-CAPTURE 슬라이스)가 담당 — 이중 기록 금지.
  - 신규 레코드는 occurred_at 과 recorded_at 만 additive로 허용하고 at == recorded_at 호환 alias를 유지한다.
  - cursor planner는 public Git metadata를 읽기만 하며 ledger/cursor/Git/runtime/network를 직접 변경하지 않는다.
  - source public classification은 planner가 독립 판정하지 않으며 owner-approved caller의 exact tuple+runtime repo_path allowlist attestation으로 제한한다.
steps:
  - step_id: compose_five_fields
    actor_slot: active_unit
    action:
      kind: local_reasoning
      note: 세션의 AI 가 방금 작업에 대해 5필드를 스스로 작성 — 입력(무엇을 보고 시작), 판단(결정 기준), 출력(만든 것 — 경로/커밋 ref), 검증(성공 확인 방법), 중단조건(다음에 자동으로 하면 안 되는 경우), request_kind 슬러그("행위/출처", 예 review/mail).
    inputs: [bounded_task_result]
    outputs: [five_field_json]
    next: { on_success: land_record, on_fail: stop }
  - step_id: land_record
    actor_slot: active_unit
    action:
      kind: local_tool
      tool: node .workflow/five_field_session_capture_v0/tools/five_field_capture.mjs
      note: --project <P> --session-ref <ref> --worker <label> --request-kind <slug> --json '<five_field_json>' (재실행 멱등 — 동일 내용은 duplicate skip)
    inputs: [five_field_json, session_ref, worker_label, project_code]
    outputs: [five_field_ledger_record, capture_receipt]
    next: { on_success: done, on_fail: stop }
recovery_contract:
  display_name_ko: AI 작업 결과 누락 복구
  feature_state: "OFF"
  public_implementation_state: isolated_runner_available
  live_activation_state: HOLD
  planner: tools/five_field_cursor_sweep.mjs
  runner: tools/five_field_cursor_runner.mjs
  runner_cli: node .workflow/five_field_session_capture_v0/tools/five_field_cursor_runner.mjs --input <owner-approved-input.json>
  first_live_source_classification: public_only
  private_source_commit_lane: HOLD
  topology:
    source: owner_injected_immutable_public_snapshot
    writer: owner_injected_isolated_private_or_synthetic_clone
    foreground_discovery: forbidden
    source_writer_overlap: forbidden
  cursor_identity: [repo, ref, source_lane]
  cursor_update: full_record_digest_compare_and_swap
  post_cursor_push_unverified_state: UNKNOWN_AFTER_PUSH
  post_cursor_push_recovery: fresh_remote_read_and_reconcile
  range: "(last_successful_source_commit, candidate_target]"
  order: oldest_to_newest
  worker_identity:
    source: injected_installed_runtime_metadata
    missing_or_mismatch: HOLD
  self_loop_trailers:
    - "Soulforge-Automation-Output: ai-work-result-recovery/v1"
    - "Soulforge-Source-Lane: sha256:<canonical-tuple-digest>"
  self_loop_receipt: itemized
  advance_requires:
    - record_validation_success
    - output_commit_success
    - output_non_force_push_success
    - remote_contains_output_commit
    - cursor_compare_and_swap_success
    - cursor_commit_success
    - cursor_non_force_push_success
    - remote_contains_cursor_commit
    - remote_cursor_content_verified
    - source_target_still_approved
  hold_on:
    - baseline_not_ancestor
    - history_rewrite_or_non_fast_forward
    - source_ref_movement
    - same_identity_different_full_record_digest
    - runtime_identity_missing_or_mismatch
    - secret_or_absolute_path_sentinel
    - writer_binding_or_allowlist_mismatch
    - cursor_compare_and_swap_mismatch
    - cursor_push_or_remote_inclusion_uncertain
    - incomplete_success_evidence
  append_only:
    records_deleted: 0
    records_rewritten: 0
  direct_writes:
    - owner_allowlisted_isolated_writer_object_database
    - owner_allowlisted_writer_remote_ref_non_force
  live_write_gate:
    - fresh_level_3_actual_diff_verdict
    - human_owner_private_cursor_target_approval
    - human_owner_writer_binding_approval
    - human_owner_automation_update_and_activation_approval
  dry_run_upper_bound_note: "313 is the ledger_records=[] synthetic upper bound, not an actual missing count."
guard_binding:
  status: disabled_pending_owner_review
  disabled_on: 2026-07-14
  reason: 운영 장애와 자동화 효용 재검토를 위해 Codex/Claude Code의 PostToolUse 마킹과 Stop 차단 배선을 함께 중지했다.
  note: 어댑터 스크립트는 후속 검토를 위해 보존하지만 활성 하네스 설정에는 연결하지 않는다.
  check_command: node .workflow/five_field_session_capture_v0/tools/five_field_capture.mjs --check --session-ref <ref>
  exit_codes: { 0: recorded, 2: missing_record }
  retained_adapters:
    - tools/codex_hook_guard.mjs
    - tools/claude_stop_guard.mjs
  active_harness_bindings: []
  reactivation_requires:
    - 현행 Codex/Claude Code 훅 스키마와 설정 로드 검증
    - 운영 장애 및 자동화 효용 재평가
    - owner 결정
  unaffected_surfaces:
    - five_field_capture_cli
    - existing_ledgers
    - dev_erp_completion_capture
    - cursor_sweep_candidate
owner_decision_needed:
  - AGENTS.md end-of-task 체크리스트에 이 워크플로우 1줄 편입 여부(canon 변경)
  - post_development_review_gate_v0 마지막 스텝으로 바인딩 여부
  - index.yaml 정식 등록(workflow-check 통과 후)
  - private cursor owner/path ratification and isolated runner activation
validation_level: draft_with_local_tool_smoke_check
registration_policy: owner_requested_registration
output_state: draft
notes:
  - Draft workflow built from a real task (2026-07-04 owner request — "평소 Codex 세션 대화에서도 끝나면 남겨지도록").
  - ERP completion_log(업무 레인)와 같은 스키마 계열(soulforge.five_field_capture.v0) — 승격 감지기(request_kind 반복 집계)가 두 레인을 함께 읽는다.
  - 2026-07-14 owner 요청으로 Codex/Claude Code 차단형 PostToolUse/Stop 배선을 함께 비활성화했다. CLI, 기존 레저, ERP 캡처와 어댑터 스크립트는 보존한다.
  - 2026-07-30 public candidate는 최근 24시간/foreground pull 의존을 제거했지만 private cursor와 live automation은 만들거나 활성화하지 않았다.
  - 2026-07-30 Phase B added the public isolated runner and synthetic-only verification surface; installed automation, private cursor, and live writer remain HOLD.
